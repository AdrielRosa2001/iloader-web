[package]
name = "iloader-core"
description = "Sideloading logic of iloader, without any GUI/Tauri dependency"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
idevice = { version = "0.1.68", features = ["usbmuxd", "house_arrest", "afc", "core_device_proxy", "remote_pairing", "tcp", "tunnel_tcp_stack", "xpc", "rsd", "pair"] }
isideload = { version = "0.5.2", default-features = false, features = ["install", "tokio-mt"] }
futures = "0.3.31"
reqwest = "0.13.2"
tokio = { version = "1.49.0", features = ["sync", "time", "fs", "macros"] }
tracing = "0.1.44"
plist = "1.8.0"
plist-macro = "0.1.6"
tokio-util = "0.7.18"
rootcause = "0.12.1"
thiserror = "2.0.18"
strum = { version = "0.28.0", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
chacha20poly1305 = "0.10"
sha2 = "0.10"
base64 = "0.22"

[dev-dependencies]
tokio = { version = "1.49.0", features = ["rt-multi-thread", "macros"] }
tempfile = "3"
