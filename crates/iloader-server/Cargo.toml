[package]
name = "iloader-server"
description = "Headless HTTP/WebSocket server exposing iloader to a web UI"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
iloader-core = { path = "../iloader-core" }
isideload = { version = "0.5.2", default-features = false, features = ["install", "tokio-mt"] }
axum = { version = "0.8", features = ["ws", "macros"] }
tokio = { version = "1.49.0", features = ["rt-multi-thread", "macros", "signal", "fs", "net", "sync", "time", "io-util"] }
tower-http = { version = "0.6", features = ["fs", "limit", "set-header"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3.31"
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
tracing-appender = "0.2"
chrono = "0.4"
rustls = "0.23.36"
uuid = { version = "1", features = ["v4"] }
subtle = "2.6"
rand = "0.9"
hex = "0.4"
cookie = "0.18"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio-tungstenite = "0.28"
